<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif}
.container{max-width:1050px;margin:0 auto;padding:20px 18px 35px}
.header{text-align:center;padding:30px 0 25px}
.logo{font-size:42px;font-weight:850;letter-spacing:-2px;margin:0}
.logo span{font-weight:500}
.header p{margin:8px 0 0;color:#777;font-size:16px}
.search-wrapper{position:relative;margin-bottom:32px}
.search{width:100%;height:54px;padding:0 18px 0 48px;border:0;border-radius:17px;background:#fff;font-size:17px;outline:none;box-shadow:0 3px 15px rgba(0,0,0,.05)}
.search-icon{position:absolute;left:17px;top:16px;font-size:20px;color:#888;pointer-events:none}
.section-title{display:flex;align-items:center;gap:9px;font-size:23px;font-weight:750;letter-spacing:-.4px;margin:30px 0 15px}
.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{display:flex;align-items:center;min-height:112px;padding:15px;background:rgba(255,255,255,.97);border-radius:22px;box-shadow:0 5px 20px rgba(0,0,0,.055),0 1px 2px rgba(0,0,0,.04);transition:transform .15s}
.card:active{transform:scale(.985)}
.app-icon{width:68px;height:68px;min-width:68px;border-radius:17px;margin-right:14px;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.10);overflow:hidden}
.app-icon img{width:100%;height:100%;object-fit:contain;padding:7px}
.card-info{min-width:0;flex:1}
.app-name{font-size:16px;font-weight:720;line-height:1.25;letter-spacing:-.2px;overflow-wrap:anywhere}
.version{color:#888;font-size:12px;margin-top:6px}
.install{display:inline-flex;align-items:center;justify-content:center;min-width:90px;margin-left:9px;padding:10px 12px;border-radius:13px;background:#111;color:#fff;text-decoration:none;font-size:13px;font-weight:650;white-space:nowrap}
.install:hover{background:#2b2b2b}
.no-results{display:none;text-align:center;color:#888;padding:40px 20px;font-size:16px}
.footer{text-align:center;color:#999;font-size:13px;margin-top:38px;line-height:1.9}
.contacts{display:flex;justify-content:center;align-items:center;gap:10px 22px;flex-wrap:wrap;margin-top:12px}
.contacts a{color:#555;text-decoration:none;border-bottom:1px solid #d5d5d9;padding-bottom:2px}
.contacts a:hover{color:#111}
@media(max-width:700px){
.container{padding:12px 13px 30px}.header{padding:25px 0 20px}.logo{font-size:36px}
.apps{grid-template-columns:1fr;gap:11px}.card{min-height:100px;padding:12px;border-radius:19px}
.app-icon{width:62px;height:62px;min-width:62px;border-radius:15px;margin-right:12px}
.app-name{font-size:15px}.version{font-size:12px;margin-top:5px}
.install{min-width:80px;padding:9px 10px;font-size:12px;margin-left:6px}
.section-title{font-size:21px;margin-top:27px}
}
@media(max-width:370px){.app-icon{width:55px;height:55px;min-width:55px}.install{min-width:70px;padding:8px}.app-name{font-size:14px}}
</style>

const collator = new Intl.Collator("ru", {sensitivity:"base",numeric:true});
function render(){
  ["banks","services"].forEach(group=>{
    const root=document.getElementById(group);
    root.innerHTML="";
    apps.filter(a=>a.group===group).sort((a,b)=>collator.compare(a.name,b.name)).forEach(a=>{
      const card=document.createElement("article");
      card.className="card";
      const icon=document.createElement("div");
      icon.className="app-icon";
      const img=document.createElement("img");
      img.src=a.icon || ("https://www.google.com/s2/favicons?domain="+encodeURIComponent(a.domain)+"&sz=128");
      img.alt="";
      img.loading="lazy";
      img.onerror=()=>{icon.innerHTML='<span style="font-size:25px;font-weight:800;color:#555">'+a.name.slice(0,1).toUpperCase()+'</span>';};
      icon.appendChild(img);
      const info=document.createElement("div");
      info.className="card-info";
      const name=document.createElement("div");
      name.className="app-name";
      name.textContent=a.name;
      const version=document.createElement("div");
      version.className="version";
      version.textContent=a.version;
      info.append(name,version);
      const link=document.createElement("a");
      link.className="install";
      link.href=a.url;
      link.textContent="Установить";
      card.append(icon,info,link);
      root.appendChild(card);
    });
  });
}
render();

const search=document.getElementById("search");
const noResults=document.getElementById("noResults");
search.addEventListener("input",function(){
  const query=this.value.toLowerCase().trim();
  let visible=0;
  document.querySelectorAll(".card").forEach(card=>{
    const show=card.innerText.toLowerCase().includes(query);
    card.style.display=show?"":"none";
    if(show)visible++;
  });
  document.querySelectorAll(".section-title").forEach(title=>{
    const grid=title.nextElementSibling;
    title.style.display=[...grid.querySelectorAll(".card")].some(c=>c.style.display!=="none")?"":"none";
  });
  noResults.style.display=visible===0?"block":"none";
});
